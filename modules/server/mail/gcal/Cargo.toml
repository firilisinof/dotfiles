[package]
name = "gcal"
version = "0.1.0"
edition = "2021"
description = "Command-line client for Google Calendar"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
